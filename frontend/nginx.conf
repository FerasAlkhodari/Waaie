# Map the client's Upgrade header so the realtime voice WebSocket (/api/voice)
# gets "Connection: upgrade" while ordinary HTTP requests get "Connection:
# close". Without this the WS handshake never upgrades and the browser sees a
# code 1006 abnormal closure. Lives in the http context (conf.d include).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API to the backend container over the internal Docker
    # network. The frontend bundle calls /api/* (same origin), so there is no
    # second public subdomain and no CORS. Using Docker's embedded DNS resolver
    # (127.0.0.11) with a variable upstream means the backend's container IP is
    # re-resolved at request time — nginx survives backend restarts/redeploys
    # instead of caching a stale IP at startup.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend_upstream backend:8000;

        # Strip the /api prefix so the backend sees its real routes (/ask, /health).
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the /api/voice realtime proxy. Harmless for
        # plain HTTP requests (Upgrade is empty -> Connection: close).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long enough to cover a full voice call (server cap is 300s) without
        # nginx tearing down an otherwise-idle WebSocket mid-call.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: route all unknown paths to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted static assets.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
